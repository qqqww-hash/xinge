name: 构建番茄钟 APK

# 用法：把本文件放到仓库的 .github/workflows/build.yml，push 后自动编译。
# 编译完成后在 Actions 里下载，或直接访问 Releases 的固定地址。

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 生成工程文件
        run: |
          set -e
          mkdir -p app/src/main/java/com/xin/pomodoro app/src/main/res/drawable
          printf '%s' '' | base64 -d > settings.gradle.kts
          printf '%s' 'cGx1Z2lucyB7CiAgICBpZCgiY29tLmFuZHJvaWQuYXBwbGljYXRpb24iKSB2ZXJzaW9uICI4LjQuMiIgYXBwbHkgZmFsc2UKfQo=' | base64 -d > build.gradle.kts
          printf '%s' 'b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bSAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD1mYWxzZQphbmRyb2lkLm5vblRyYW5zaXRpdmVSQ2xhc3M9dHJ1ZQo=' | base64 -d > gradle.properties
          printf '%s' '' | base64 -d > app/build.gradle.kts
          printf '%s' '' | base64 -d > app/src/main/AndroidManifest.xml
          printf '%s' '' | base64 -d > app/src/main/res/drawable/ic_launcher.xml
          printf '%s' '
